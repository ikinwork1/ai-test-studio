beforeEach:
  - gotoUrl: "https://disp-dev.loc/login"

cases:
  - name: "Авторизация в Диспетчерском центре"
    steps:
      # 1. Явно ждем, пока страница прогрузится и появится заголовок
      - aiWaitFor: 'На странице отображается заголовок "Авторизация"'

      # 2. Вводим логин (используем точный плейсхолдер со скриншота)
      - aiAct: 'Кликнуть в центр голубого прямоугольного окна под текстом "Логин" и ввести "disp@disp.ru"'
    
      # 3. Вводим пароль (точный плейсхолдер)
      - aiAct: 'Кликнуть в прямоугольное окно c текстом "Пароль" и ввести "3edc#EDC"'

      # 4. Нажимаем кнопку (описываем её цвет и текст для точности)
      - aiAct: 'Кликнуть в центр зеленой кнопки с текстом "Войти"'

      # 5. Проверяем результат (ждем исчезновения формы или появления меню)
      - aiWaitFor: 'Форма авторизации исчезла, и отображается главное меню или рабочий стол системы'
      - aiAssert: 'На странице больше нет кнопки "Войти"'