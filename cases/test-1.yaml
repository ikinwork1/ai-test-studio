beforeEach:
  - gotoUrl: "https://disp-dev.loc/login"
cases:
  - name: "Успешный вход и проверка дашборда"
    steps:
      - aiAct: 'Ввести "testuser" в поле Логин'
      - aiAct: 'Ввести "P@ssw0rd" в поле Пароль'
      - aiAct: 'Нажать кнопку "Войти"'
      - aiWaitFor: 'Отображается главная страница или дашборд'
      - aiAssert: 'В правом верхнем углу отображается имя пользователя или аватар'
  - name: "Неверный пароль — отображается ошибка"
    steps:
      - aiAct: 'Ввести "testuser" в поле Логин'
      - aiAct: 'Ввести "wrong-password" в поле Пароль'
      - aiAct: 'Нажать кнопку "Войти"'
      - aiAssert: 'Отображается сообщение об ошибке аутентификации'